{% extends "layout.html" %}
{% block content %}
<section class="panel">
  <h2>Login</h2>
  <p>Select a role to log in:</p>

  <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
    <form method="post">
      <input type="hidden" name="role" value="Publisher">
      <button type="submit">Login as Publisher</button>
    </form>
    <form method="post">
      <input type="hidden" name="role" value="Viewer">
      <button type="submit">Login as Viewer</button>
    </form>
    <form method="post">
      <input type="hidden" name="role" value="Admin">
      <button type="submit">Login as Admin</button>
    </form>
  </div>
</section>
{% endblock %}
